services:
  db:
    image: mariadb:11.8
    environment:
      - MARIADB_DATABASE=${DB_NAME:-dbname}
      - MARIADB_USER=${DB_USER:-dbuser}
      - MARIADB_PASSWORD=${DB_PASS:?Introduce la contraseña en el fichero .env}
      - MARIADB_RANDOM_ROOT_PASSWORD=1
    volumes:
      - db-volume:/var/lib/mysql
    networks:
      - interna
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s
    restart: unless-stopped

    yourls:
      image:

      environment:

      volumes:

      networks:

      depends_on:
      
      restart: unless-stopped

    web:
      image: nginx:1.30

      volumes:

      depends_on:

      ports:

      restart: unless-stopped

volumes:

networks:
