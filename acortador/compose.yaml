services:
  db:
    image: mariadb:11.8
    environment:
      - MARIADB_DATABASE=${DB_NAME:-dbname}
      - MARIADB_USER=${DB_USER:-dbuser}
      - MARIADB_PASSWORD=${DB_PASS:?Introduce la contraseña en el fichero .env}
      - MARIADB_RANDOM_ROOT_PASSWORD=1
    volumes:
      - db-volume:/var/lib/mysql
    networks:
      - interna
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  yourls:
    image: yourls:1.10.3-fpm
    environment:
      - YOURLS_DB_HOST=db
      - YOURLS_DB_NAME=${DB_NAME:-dbname}
      - YOURLS_DB_USER=${DB_USER:-dbuser}
      - YOURLS_DB_PASS=${DB_PASS:?Introduce la contraseña en el fichero .env}
      - YOURLS_SITE=http://${DIRECCION:?Introduce la direccion en el fichero .env}:${PORT:-8080}
      - YOURLS_USER=${YOURLS_USER:-admin}
      - YOURLS_PASS=${YOURLS_PASS:?Introduce la contraseña de YOURLS en el fichero .env}
    volumes:
      - codigo:/var/www/html
    networks:
      - frontal
      - interna
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    image: nginx:1.30
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - codigo:/var/www/html:ro
    networks:
      - frontal
    ports:
      - "${PORT:-8080}:80"
    depends_on:
      - yourls
    restart: unless-stopped

volumes:
  db-volume:
  codigo:
networks:
  interna:
  frontal: