services:
  forgejo:
    image: codeberg.org/forgejo/forgejo:17
    environment:
      - USER_UID=1000
      - USER_GID=1000
      - FORGEJO__database__DB_TYPE=postgres
      - FORGEJO__database__HOST=db:5432
      - FORGEJO__database__NAME=${DB_NAME:-dbname}
      - FORGEJO__database__USER=${DB_USER:-dbuser}
      - FORGEJO__database__PASSWD=${DB_PASS:?Introduce la contraseña en el fichero .env}
      - FORGEJO__server__DOMAIN=${DIRECCION:?Introduce tu direccion en el fichero .env}
      - FORGEJO__server__ROOT_URL=http://${DIRECCION:?Introduce la dirección en el fichero .env}:${FORGEJO_PORT:-3000}
      - FORGEJO__server__SSH_PORT=${SSH_PORT:-2222}
      - FORGEJO__server__SSH_LISTEN_PORT=22
      - FORGEJO__security__INSTALL_LOCK=true
      - FORGEJO__mailer__ENABLED=true
      - FORGEJO__mailer__PROTOCOL=smtp
      - FORGEJO__mailer__SMTP_ADDR=correo
      - FORGEJO__mailer__SMTP_PORT=1025
      - FORGEJO__mailer__FROM=forgejo@example.com
      - FORGEJO__cache__ADAPTER=redis
      - FORGEJO__cache__HOST=redis://:${REDIS_PASS:?Introduce la contraseña de redis en el fichero .env}@cache:6379/0
      - FORGEJO__session__PROVIDER=redis
      - FORGEJO__session__PROVIDER_CONFIG=redis://:${REDIS_PASS:?Introduce la contraseña de redis en el fichero .env}@cache:6379/0
      - FORGEJO__queue__TYPE=redis
      - FORGEJO__queue__CONN_STR=redis://:${REDIS_PASS:?Introduce la contraseña de redis en el fichero .env}@cache:6379/0
    volumes:
      - forgejo-volume:/data
      - /etc/localtime:/etc/localtime:ro
    networks:
      - interna
    ports:
      - "${FORGEJO_PORT:-3000}:3000"
      - "${SSH_PORT:-2222}:22"
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
      correo:
        condition: service_started
    restart: unless-stopped

  db:
    image: postgres:18
    environment:
      - POSTGRES_DB=${DB_NAME:-dbname}
      - POSTGRES_USER=${DB_USER:-dbuser}
      - POSTGRES_PASSWORD=${DB_PASS:?Introduce la contraseña en el fichero .env}
    volumes:
      - pg-datos:/var/lib/postgresql
    networks:
      - interna
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s
    restart: unless-stopped
  
  
  cache:
    image: redis:7.2
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\""]
    environment:
      REDIS_PASSWORD: ${REDIS_PASS:?falta en el fichero .env}
    volumes:
      - cache-datos:/data
    networks:
      - interna
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  correo:
    image: axllent/mailpit:v1.32
    networks: 
      - interna
    ports:
      - "${CORREO_PORT:-8025}:8025"      
    restart: unless-stopped

volumes:
  forgejo-volume:
  pg-datos:
  cache-datos:

networks:
  interna: